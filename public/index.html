<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tank Turbulence Online</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page">
    <section id="lobby" class="panel lobby">
      <div>
        <p class="eyebrow">ONLINE MULTIPLAYER</p>
        <h1>坦克动荡 Online</h1>
        <p class="sub">2–4 人实时联机。创建房间，把 6 位房间号发给朋友即可。</p>
      </div>

      <label class="field">
        <span>昵称</span>
        <input id="nameInput" maxlength="16" value="Tank" autocomplete="nickname" />
      </label>

      <div class="lobby-actions">
        <button id="createBtn" class="primary">创建房间</button>
        <div class="join-row">
          <input id="roomInput" maxlength="6" placeholder="输入房间号" autocomplete="off" />
          <button id="joinBtn">加入</button>
        </div>
      </div>

      <p id="lobbyError" class="error" aria-live="polite"></p>

      <div class="help">
        <strong>操作：</strong>W/S 前后移动，A/D 转向，空格射击。子弹可以撞墙反弹。
      </div>
    </section>

    <section id="game" class="game hidden">
      <header class="hud">
        <div>
          <div class="room-line">房间 <button id="roomCodeBtn" class="code-btn" title="点击选中房间号"></button></div>
          <div id="statusText" class="status">连接中...</div>
        </div>
        <div id="scoreboard" class="scoreboard"></div>
        <button id="restartBtn" class="restart hidden">重新开始整场</button>
      </header>

      <div class="canvas-wrap">
        <canvas id="canvas" width="1200" height="720"></canvas>
        <div id="centerMessage" class="center-message"></div>
      </div>

      <footer class="footer">
        <span>W/S 移动　A/D 转向　空格射击</span>
        <span id="connectionState">● 已连接</span>
      </footer>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
